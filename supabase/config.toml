project_id = "aigrow"

[api]
port = 54331

[db]
port = 54332
shadow_port = 54330
major_version = 15

[studio]
port = 54333

[inbucket]
port = 54334
smtp_port = 54335
pop3_port = 54336

[analytics]
port = 54337
backend = "postgres"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "https://aigro.io/**"]

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.email.template.confirmation]
subject = "AIGRO｜確認你嘅電郵地址"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "AIGRO｜重設密碼"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "AIGRO 專屬邀請｜加入會員專區"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "AIGRO｜安全登入連結"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.email_change]
subject = "AIGRO 安全通知｜確認新電郵地址"
content_path = "./supabase/templates/email-change.html"

[auth.email.notification.password_changed]
enabled = true
subject = "AIGRO 安全通知｜密碼已更新"
content_path = "./templates/password-changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "AIGRO 安全通知｜帳號電郵已更新"
content_path = "./templates/email-changed.html"

[functions.ask-answer]
# Visitors sign in with Supabase Anonymous Auth, so every chat has a real JWT
# and auth.uid() owner. This must stay enabled in every deployed environment.
verify_jwt = true

[functions.knowledge-worker]
# The durable worker is invoked by an internal scheduler/webhook and authenticates
# with x-worker-secret. Never expose KNOWLEDGE_WORKER_SECRET to the browser.
verify_jwt = false

[functions.persona-compiler]
# Internal durable worker. It compiles only published instructor evidence and
# authenticates with x-worker-secret; never expose PERSONA_COMPILER_SECRET.
verify_jwt = false

[functions.booking-notify]
# Database webhook handler; authenticated with x-webhook-secret.
verify_jwt = false

[functions.social-sync-worker]
# Database dispatcher supplies a dedicated x-worker-secret. TikHub credentials
# stay server-side and this endpoint never accepts browser-originated jobs.
verify_jwt = false

[functions.invite-expert-owner]
# Super-admin browser workflow. The function validates the caller JWT and the
# protected account_access role before using service-only invitation methods.
verify_jwt = true

[functions.admin-send-invite]
# Called from the admin browser with the signed-in user's JWT. The function also
# checks public.is_super_admin() before touching Auth Admin or Resend APIs.
verify_jwt = true

[functions.resend-webhook]
# Resend signs every webhook with Svix headers; the handler verifies those
# headers using RESEND_WEBHOOK_SECRET before accepting a delivery update.
verify_jwt = false
