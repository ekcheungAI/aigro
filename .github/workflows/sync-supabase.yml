name: Sync argro → Supabase items

# 每 30 分鐘將 argro 管道 (Zeabur) 最新情報 upsert 入 Supabase `items`,
# 令前端 runtime 讀到 live 真實數據(取代 build-time snapshot)。
# 需要 repo secret: SUPABASE_SECRET_KEY (Supabase service/secret key — server-side only)。

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: # 手動觸發:Actions → Sync argro → Supabase items → Run workflow

permissions:
  contents: none

concurrency:
  group: argro-supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep the post-sync checker pointed at the exact database that the
      # sync step wrote. A step-local env silently made production checks use
      # an older Supabase project.
      SUPABASE_URL: https://zpdwalqnhkbxhmaagkfc.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (opencc-js lives in devDependencies)
        run: npm ci --no-audit --no-fund

      - name: Sync argro items → Supabase
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ARGRO_API_BASE: https://argro-api.zeabur.app
          ARGRO_API_KEY: ${{ secrets.ARGRO_API_KEY }}
          # The sync script still fails closed: this flag only publishes rows
          # that pass the AI relevance, source, freshness and zh-HK gates.
          ARGRO_AUTO_PUBLISH: "true"
        run: node scripts/sync-argro-to-supabase.mjs

      - name: Verify published AI news freshness and quality
        run: npm run check:news

      - name: Verify public MCP protocol and latest data
        run: npm run check:mcp

      - name: Verify production read paths and function guards
        run: npm run check:production
