<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AIGRO — 香港最值得信賴的 AI・增長・商業情報平台。每一篇內容經過編輯審核，每一位導師經過認證。" />
    <meta property="og:title" content="AIGRO — 香港 AI・增長情報平台" />
    <meta property="og:description" content="可信賴的 AI・增長・商業情報，香港視角。" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <title>AIGRO — 香港 AI × Growth 情報平台</title>
    <link rel="preload" as="image" href="/hero-cinematic.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Serif+TC:wght@500;700&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Theme bootstrap: localStorage > system preference. Prevents flash of wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('aigro-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
