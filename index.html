        rel="stylesheet"
      />
    </noscript>
    <script>
      // Theme bootstrap: localStorage > system preference. Prevents flash of wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('aigro-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}

        // Keep the supporting Latin font stylesheet off the render-critical path.
        // The Unicode-subsetted Chiron CJK webfont is self-hosted in the app bundle.
        var fonts = document.getElementById('aigro-fonts');
        if (fonts) {
          var activateFonts = function () { fonts.media = 'all'; };
          if (fonts.sheet) activateFonts();
          else fonts.addEventListener('load', activateFonts, { once: true });
        }
      })();
    </script>
